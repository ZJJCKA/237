name: Package metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install build metadata prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Validate feeds and package metadata
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"

          ./scripts/feeds update -a 2>&1 | tee -a "$log_file"
          ./scripts/feeds install -a 2>&1 | tee -a "$log_file"
          cp defconfig/mt7986-ax6000.config .config

          # Feed indexing necessarily scans core packages before their feed
          # providers are installed. Only the final, fully installed metadata
          # pass represents unresolved dependencies.
          : > "$log_file"
          make defconfig 2>&1 | tee -a "$log_file"

          if grep -E "WARNING: Makefile .* has (a dependency|a build dependency) on .*which does not exist" "$log_file"; then
            echo "Unresolved package metadata dependencies were found." >&2
            exit 1
          fi

          if grep -F "recursive dependency detected" "$log_file"; then
            for symbol in \
              PACKAGE_luci-app-qmodem \
              PACKAGE_luci-app-qmodem-mwan \
              PACKAGE_luci-app-qmodem-next \
              PACKAGE_luci-app-qmodem-sms \
              PACKAGE_luci-app-qmodem-hc \
              PACKAGE_luci-app-qmodem-monitor \
              PACKAGE_luci-app-qmodem-ttl \
              PACKAGE_qmodem_monitor \
              PACKAGE_kmod-rmnet-nss \
              PACKAGE_rd05a1; do
              grep -n -A 12 -B 3 "^config $symbol$" tmp/.config-package.in || true
            done
            echo "A recursive Kconfig package dependency was found." >&2
            exit 1
          fi

          grep -Fqx 'GO_VERSION_MAJOR_MINOR:=1.26' package/lang/golang/golang1.26/Makefile
          grep -Fqx 'GO_VERSION_PATCH:=5' package/lang/golang/golang1.26/Makefile
          grep -Fqx 'PKG_VERSION:=1.89.0' package/lang/rust/Makefile
